spring.application.name=finalna-tacka

# --- MongoDB (Spring Boot 4: spring.mongodb.*, NOT spring.data.mongodb.*) ---
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/musicapp?replicaSet=rs0}

# --- Neo4j ---
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:database}

# --- RabbitMQ ---
# Connection settings are also read directly in RabbitConfig (env vars with localhost
# defaults); these properties keep Spring Boot's actuator/health aware of the broker.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# --- Saga demo toggles ---
saga.graph.fail-create=false
saga.graph.fail-listen=false

# --- Demo seeder (DemoDataSeeder) ---
# Pokrece se na svakom startu aplikacije, ali je idempotentan (preskace ako je vec seed-ovano).
# Iskljuci sa app.seed.demo.enabled=false.
app.seed.demo.enabled=true
app.seed.demo.saga-timeout-seconds=30
